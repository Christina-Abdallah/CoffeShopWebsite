# -----------------------------------------------------------------------------
# Brew & Co. — Full-Stack Docker Compose (development)
# -----------------------------------------------------------------------------
# Starts the frontend (Vite), backend API (Express + Prisma), and PostgreSQL.
#
# Usage:
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down
# -----------------------------------------------------------------------------

services:
  db:
    image: postgres:15
    container_name: brew-co-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: brewco
    # Exposed only on localhost for local debugging; backend uses Docker network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brewco"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: brew-co-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD:-password}@db:5432/brewco?schema=public"
      PORT: 3000
      CLIENT_URL: "http://localhost:5175"
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@brewco.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NAME: ${ADMIN_NAME:-Arthur Pendelton}
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "entrypoint.sh"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brew-co-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: "http://localhost:3002/api"
      VITE_ADMIN_API_URL: "http://localhost:3002/api/admin"
    ports:
      - "127.0.0.1:5175:5173"
    depends_on:
      - backend
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host"]
    stdin_open: true
    tty: true

volumes:
  postgres_data:
